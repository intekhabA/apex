version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: diagnolab-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: diagnolab_db
      MYSQL_USER: diagnolab
      MYSQL_PASSWORD: diagnolab_secret
      MYSQL_ROOT_PASSWORD: diagnolab_root_secret
    ports:
      - "3306:3306"
    volumes:
      - diagnolab_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "diagnolab", "-pdiagnolab_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diagnolab-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=diagnolab
      - MYSQL_PASSWORD=diagnolab_secret
      - MYSQL_DATABASE=diagnolab_db
      - DATABASE_URL=mysql+aiomysql://diagnolab:diagnolab_secret@mysql:3306/diagnolab_db
      - SYNC_DATABASE_URL=mysql+pymysql://diagnolab:diagnolab_secret@mysql:3306/diagnolab_db
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_ROOT=${STORAGE_LOCAL_ROOT:-./storage/uploads}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-diagnolab-reports}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diagnolab-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    container_name: diagnolab-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/app/storage:ro
    depends_on:
      - backend
      - frontend

  adminer:
    image: adminer
    container_name: diagnolab-adminer
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    ports:
      - "8085:8080"
    depends_on:
      - mysql

volumes:
  diagnolab_mysql_data:
    external: true
